name: Backend

# Runs only when backend code, this workflow, or docker-compose.yml changes. Native path filters
# skip the whole workflow otherwise, so no extra change-detection job is needed.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      # Tests check that the Testcontainers image matches this file.
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      # Tests check that the Testcontainers image matches this file.
      - 'docker-compose.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to full commit SHAs because tags can be moved to
      # point at different code; a SHA cannot. The comment records the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # ubuntu-latest runners ship with Docker, which Testcontainers uses to
      # start PostgreSQL for the integration tests. No extra setup needed.
      - run: ./mvnw --batch-mode verify
