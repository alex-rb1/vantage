version: 2

# Grouping: each ecosystem gets one weekly PR bundling all its minor and patch
# updates. These are expected to be backwards compatible, so reviewing them
# together cuts noise. Major updates match no group, so Dependabot opens a
# separate PR for each one: they can contain breaking changes and deserve
# individual review (and, for PostgreSQL, a deliberate data upgrade).

updates:
  # Actions are pinned to commit SHAs. Dependabot updates the SHA and the
  # trailing "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Only major updates are ignored; minor and patch updates still arrive.
    ignore:
      # Revisit when typescript-eslint supports TypeScript 7 (its peer range
      # currently stops below 6.1, so `npm ci` fails).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Its major version must match the project's Node version (.nvmrc);
      # bump it by hand when upgrading Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Covers the postgres image in docker-compose.yml. Dependabot cannot see the
  # Testcontainers image (TestcontainersConfiguration.POSTGRES_IMAGE), so its
  # PRs change only the compose file. The Backend workflow runs on those PRs,
  # and PostgresImageConsistencyTest fails until the constant is updated to
  # match: push that one-line fix to the Dependabot branch before merging.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
