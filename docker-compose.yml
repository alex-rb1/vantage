services:
  postgres:
    # Pinned to an exact minor version so every environment runs the same
    # PostgreSQL release, and so Dependabot proposes each minor update as a PR.
    # Minor updates are safe for existing data; a major upgrade changes the
    # on-disk format and must be a deliberate step.
    # Must match TestcontainersConfiguration.POSTGRES_IMAGE in the backend
    # tests. PostgresImageConsistencyTest fails if they drift apart.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/,
      # so the volume is mounted at the parent directory (not .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
